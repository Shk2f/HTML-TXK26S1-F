<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>HaalariShop</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/products.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="container">
        <nav class="nav">
            <a href="index.html" class="logo-link">
                <img src="images/logo.webp" alt="HaalariShop logo" width="1774" height="887">
            </a>
            <ul class="nav-links">
                <li><a href="./">Etusivu</a></li>
                <li><a href="products" aria-current="page">Tuotteet</a></li>
                <li><a href="contact">Yhteystiedot</a></li>
            </ul>
        </nav>
        <main>
            <img src="images/haalarimerkit.webp" alt="Haalarimerkit – tuotteet" class="main-image" width="2172" height="724" fetchpriority="high">
            <div class="product-list">
                <div class="product-item">
                    <h2>Suomen lippu</h2>
                    <img src="images/haalarimerkki-suomi.webp" alt="Suomen lippu" width="1536" height="1024" loading="lazy">
                    <p>Osta Suomen lippu -haalarimerkki.</p>
                </div>
                <div class="product-item">
                    <h2>Kela laiskuri</h2>
                    <img src="images/haalarimerkki-kela.webp" alt="Kela-laiskuri-haalarimerkki" width="1536" height="1024" loading="lazy">
                    <p>Osta Kela-laiskuri-haalarimerkki.</p>
                </div>
                <div class="product-item">
                    <h2>Party goose</h2>
                    <img src="images/haalarimerkki-goose.webp" alt="Party Goose -haalarimerkki" width="1536" height="1024" loading="lazy">
                    <p>Osta Party Goose -haalarimerkki.</p>
                </div>
        </main>
    </div>
</body>
